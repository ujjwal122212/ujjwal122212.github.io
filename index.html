<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lakshvi</title>
<style>
  :root { --bg:#faf5e9; --text:#251a3b; --muted:#6b6070; --accent:#6a0dad; --gold:#d4af37; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0a05; --text:#f9fafb; --muted:#98a2b3; --accent:#9d4edd; }
  }
  body { margin:0; background:var(--bg); color:var(--text); min-height:100vh;
         display:flex; align-items:center; justify-content:center; text-align:center;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; padding:40px 20px; }
  h1 { font-size:40px; letter-spacing:4px; margin:0;
       background:linear-gradient(90deg,var(--gold),var(--accent));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { color:var(--muted); letter-spacing:1.5px; font-size:13px; text-transform:uppercase; }
  p { margin:20px 0; }
  a { color:var(--accent); }
  footer { margin-top:32px; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>LAKSHVI</h1>
  <div class="tag">Your Money · Your Plan · Your Growth</div>
  <p>A private personal-finance app for Android. Track accounts and transactions, plan
  budgets around your salary cycle, and keep everything backed up to your own Google
  Drive — with no ads and no tracking.</p>
  <footer>
    <a href="privacy.html">Privacy Policy</a> ·
    <a href="mailto:himanshur65812@gmail.com">Contact</a>
  </footer>
</main>
</body>
</html>
